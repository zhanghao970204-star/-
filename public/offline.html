<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12021a" />
    <title>LuckyPlay - Offline</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #150319;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        box-sizing: border-box;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 28px 20px 22px;
        border-radius: 28px;
        box-sizing: border-box;
        background: linear-gradient(180deg, #7a2190 0%, #532276 100%);
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 20px;
        color: #fff;
      }
      p {
        margin: 0 0 22px;
        font-size: 13px;
        line-height: 1.55;
        color: #e6d4f8;
      }
      button {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(180deg, #38de98 0%, #02a460 100%);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <img src="/img/icons/android-chrome-192x192.png" alt="LuckyPlay" />
        <h1>You're offline</h1>
        <p>Please check your internet connection and try again.</p>
        <button type="button" onclick="location.href = '/'">Retry</button>
      </div>
    </div>
  </body>
</html>
